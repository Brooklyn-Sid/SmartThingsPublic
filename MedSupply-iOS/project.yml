# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open MedSupply.xcodeproj.
name: MedSupply
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set to your Apple team ID, or pick it in Signing & Capabilities
targets:
  MedSupply:
    type: application
    platform: iOS
    sources:
      - MedSupply
    info:
      path: MedSupply/Info.plist
      properties:
        CFBundleDisplayName: Med Supply
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Take a photo of a pill or bottle so it is easy to recognize.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.medsupply
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  MedSupplyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MedSupplyTests
    dependencies:
      - target: MedSupply
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MedSupply:
    build:
      targets:
        MedSupply: all
        MedSupplyTests: [test]
    test:
      targets:
        - MedSupplyTests
